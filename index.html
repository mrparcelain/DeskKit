<!DOCTYPE html>
<html>
    <head>
        <style>
            *, *::before, *::after { box-sizing: border-box; }

            body, html {
                margin: 0;
                padding: 0;
                background-color: rgb(0, 0, 0);
            }

            main {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                min-height: 100dvh;   /* mobile browsers: ignores the URL bar */
                padding: 2rem 1rem;
                gap: clamp(2rem, 8vh, 5rem);
            }

            /* Fluid, but capped: 85% of the screen on phones, never wider than 56rem */
            .logo {
                width: min(85vw, 56rem);
                height: auto;
            }

            a {
                font-family: "ABC Areal", sans-serif;
                color: white;
                text-decoration: underline;
                text-underline-offset: 0.15em;
                /* 20px on phones → 32px on big screens */
                font-size: clamp(1.25rem, 1rem + 1vw, 2rem);
            }

            a:hover,
            a:focus-visible {
                font-style: italic;
            }
        </style>

        <title>Desk Kit</title>
        <link rel="icon" href="./media/img/favicon.ico">
        <link rel="stylesheet" href="./css/fonts.css">
         
        <meta charset="UTF-8">
        <meta name="author" content="YOUR NAME HERE">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="title" content="YOUR TITLE HERE">
        <meta name="description" content="YOUR DESCRIPTION HERE">
        <meta name="robots" content="noindex, nofollow">
        <meta name="language" content="English">
        <meta name="darkreader-lock">
    
        <meta property="og:title" content="YOUR TITLE HERE"/>
        <meta name="og:description" content="YOUR DESCRIPTION HERE">
        <meta property="og:type" content="website"/>
        <meta property="og:url" content="YOUR URL HERE">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:image:src" content="ADD YOUR BANNER LINK HERE"/>
        <meta property='og:image:width' content='615' />
        <meta property='og:image:height' content='420' /> 
    </head>
    <body>
        <main>
            <img src="./media/svg/logo.svg" class="logo" alt="Desk Kit">
            <a href="./desktop/index.html">Enter</a>
        </main>
    </body>
</html>
