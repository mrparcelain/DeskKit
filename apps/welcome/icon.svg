<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e7ee"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#c5ccd8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb6ff"/>
      <stop offset="1" stop-color="#1f5fc9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- page with folded corner -->
  <g filter="url(#shadow)">
    <path d="M26 10h54l24 24v80a4 4 0 0 1-4 4H26a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z" fill="url(#page)" stroke="#aab3c2" stroke-width="1.5"/>
    <path d="M80 10v20a4 4 0 0 0 4 4h20z" fill="url(#fold)" stroke="#aab3c2" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- text lines -->
  <g stroke="#b9c1ce" stroke-width="4" stroke-linecap="round">
    <path d="M36 50h40"/>
    <path d="M36 62h52"/>
    <path d="M36 74h30"/>
  </g>

  <!-- blue "i" badge -->
  <g filter="url(#shadow)">
    <circle cx="86" cy="94" r="22" fill="url(#badge)" stroke="#174a9c" stroke-width="1.5"/>
    <ellipse cx="86" cy="84" rx="15" ry="9" fill="url(#gloss)"/>
    <circle cx="86" cy="83" r="3.6" fill="#ffffff"/>
    <path d="M86 91v14" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
