    Everything in this file goes inside your app's window, below the title bar.
    No <html>, <head> or <body> tags - just the content.

    Relative paths (src="assets/photo.jpg") point into this app's folder.
    Inline <script> tags don't run here: put JavaScript in script.js.
-->
<div class="starter">
    <h1 class="starter-title">Hello!</h1>
    <p class="starter-text">This is a starter app. Copy the <code>_starter</code> folder to make your own.</p>

    <ul class="starter-list" id="starter-links">
        <!-- filled in from data.json by script.js -->
    </ul>

    <div class="starter-actions">
        <button type="button" class="starter-button" id="starter-count">Clicked 0 times</button>
        <button type="button" class="starter-button" id="starter-popup">Open a second window</button>
    </div>
</div>
